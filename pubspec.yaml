name: novacart
description: "NovaCart — A premium, production-ready Flutter e-commerce app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  #Splash Screen
  flutter_native_splash: ^2.4.7

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.4.4

  # Routing
  go_router: ^17.3.0

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.4.3
  google_sign_in: ^7.2.0

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^7.3.0

  # Local Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.1

  # UI / UX
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.3
  smooth_page_indicator: ^2.0.1
  flutter_animate: ^4.5.0
  google_fonts: ^8.2.0
  gap: ^3.0.1
  photo_view: ^0.15.0
  shimmer_animation: ^2.1.0+1

  # Forms & Validation
  form_field_validator: ^1.1.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  easy_localization: ^3.0.7

  # Utilities
  dartz: ^0.10.1
  logger: ^2.4.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.0
  share_plus: ^13.2.1
  local_auth: ^3.0.2
  permission_handler: ^12.0.3

  flutter_local_notifications: ^22.0.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0B3D91"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"

flutter_native_splash:
  color: "#0B3D91"
  image: assets/images/splash_logo.png
  color_dark: "#081B33"
  image_dark: assets/images/splash_logo.png
  android_12:
    image: assets/images/splash_logo.png
    color: "#0B3D91"
    color_dark: "#081B33"
